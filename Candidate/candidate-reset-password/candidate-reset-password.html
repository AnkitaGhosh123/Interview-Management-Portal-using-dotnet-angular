<div class="reset-container">
  <h3>Reset Password</h3>
  <form [formGroup]="resetForm" (ngSubmit)="onResetPassword()">
    <div class="form-group">
      <label>Email:</label>
      <input type="email" formControlName="email" placeholder="Enter your registered email" />
    </div>
    <div class="form-group">
      <label>New Password:</label>
      <input type="password" formControlName="newPassword" placeholder="Enter new password" [ngClass]="getPasswordStrength()" />
      <div *ngIf="getPasswordStrength()" class="strength-indicator" [ngClass]="getPasswordStrength()">
        {{ getPasswordStrength() | titlecase }}
      </div>
    </div>
    <!-- ✅ Button enabled if both fields have value -->
    <button type="submit" [disabled]="!resetForm.get('email')?.value || !resetForm.get('newPassword')?.value">
      Set New Password
    </button>
  </form>
  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</div>
