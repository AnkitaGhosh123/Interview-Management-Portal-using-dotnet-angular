<app-superadmin-header></app-superadmin-header>
<div class="dashboard-container">
  <!-- Header -->
  <div class="dashboard-header">
    <h1 class="dashboard-title">SuperAdmin Dashboard</h1>

    <!-- Notification -->
    <button class="notification-btn">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      Pending Requests
      <span class="notification-badge">{{ pendingCount }}</span>
    </button>
  </div>

  <!-- Dashboard Buttons -->
  <div class="dashboard-grid">
    <button class="dashboard-btn btn-blue" routerLink="/admin-requests">Admin Requests</button>
    <button class="dashboard-btn btn-purple" routerLink="/interviewer-requests">Interviewer Requests</button>
    <button class="dashboard-btn btn-green" routerLink="/approved-requests">Approved Requests</button>
    <button class="dashboard-btn btn-red" routerLink="/rejected-requests">Rejected Requests</button>
  </div>

  
</div>
