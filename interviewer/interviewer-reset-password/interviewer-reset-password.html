<div class="reset-container">
 
  <h2>Reset Password</h2>
 
  <form [formGroup]="resetForm" (ngSubmit)="onResetPassword()">
 
    <div class="form-group">
      <label>Email:</label>
      <input type="email" formControlName="email" placeholder="Enter your registered email" />
    </div>
 
    <div class="form-group">
      <label>New Password:</label>
 
      <input type="password"
             formControlName="newPassword"
             placeholder="Enter new password"
             [ngClass]="getPasswordStrength()" />
 
      <div *ngIf="getPasswordStrength()" 
           class="strength-indicator"
           [ngClass]="getPasswordStrength()">
        {{ getPasswordStrength() | titlecase }}
      </div>
    </div>
 
    <!-- Button enabled only when both fields have value -->
    <button type="submit"
            [disabled]="!resetForm.get('email')?.value || !resetForm.get('newPassword')?.value">
      Set New Password
    </button>
 
  </form>
 
  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
 
</div>
