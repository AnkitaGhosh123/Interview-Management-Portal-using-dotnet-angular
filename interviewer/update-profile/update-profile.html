<app-header></app-header>
<div class="update-container">
  <h2>Update Profile</h2>

  <form (ngSubmit)="updateProfile()" #updateForm="ngForm" class="update-form">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="profile.fullName" name="fullName" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="profile.email" name="email" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="profile.password" name="password" required minlength="6" />
    </div>

    <div class="form-group">
      <label>Skill Set</label>
      <input type="text" [(ngModel)]="profile.skillSet" name="skillSet" required />
    </div>

    <div class="form-group">
      <label>Years of Experience</label>
      <input type="number" [(ngModel)]="profile.yearsOfExperience" name="yearsOfExperience" min="0" max="40" required />
    </div>

    <div class="form-group">
      <label>Level</label>
      <input type="text" [(ngModel)]="profile.level" name="level" required />
    </div>

    <div class="form-group">
      <label>Interview Type</label>
      <input type="text" [(ngModel)]="profile.interviewType" name="interviewType" />
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" [(ngModel)]="profile.isAvailable" name="isAvailable" />
        Available for Interviews
      </label>
    </div>

    <button type="submit" [disabled]="updateForm.invalid">Update Profile</button>
  </form>

  <p class="message">{{ message }}</p>
  <div class="back-btn-wrapper">
    <button class="btn btn-back" [routerLink]="['/interviewer-dashboard']" [disabled]="loading">
      Back to Dashboard
    </button>
  </div>
</div>
